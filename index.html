<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Ana Ekran Ayarları ve Uygulama Simgesi -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gelir Gider">
    
    <!-- Ana Ekran Simgesi (Logo) -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/fdZt2zYf/MG-2683.jpg">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/fdZt2zYf/MG-2683.jpg">
    
    <title>Gelir Gider Takibi</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            color: #ffffff;
        }

        /* 1. GİRİŞ EKRANI */
        .login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            gap: 20px;
            padding: 20px;
        }

        .img-wrapper img {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .login-box input[type="password"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            outline: none;
            text-align: center;
            background-color: #1c1c1e;
            color: #ffffff;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #0a84ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .login-box button:active {
            opacity: 0.7;
        }

        .error-msg {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            height: 18px;
        }

        /* 2. ANA UYGULAMA EKRANI */
        .app-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 4px 8px 0 8px;
            gap: 4px;
            overflow: hidden;
            background-color: #000000;
            width: 100%;
        }

        .small-logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
            height: 48px;
        }

        .small-logo-wrapper img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        /* 12 AY - TAM DÜZÜN / SIĞAN GRID Yapısı */
        .months-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 6px;
            flex: 1;
            width: 100%;
            padding: 2px;
        }

        .month-card {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 4px 2px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            min-width: 0; /* İçerik taşmasını önler */
            overflow: hidden;
        }
